<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <title>Title</title>
</head>
<body>
    <div class="container">
        <h1>Calculo de Compras</h1>
        <form action="/ejercicio1" method="POST">
            <label for="nombre">Ingresa tu nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br>
            <label for="edad">Ingresa tu edad:</label>
            <input type="text" id="edad" name="edad" required>
            <br>
            <label for="cant_tarros">Ingresa la cantidad de tarros de pintura a comprar:</label>
            <input type="text" id="cant_tarros" name="cant_tarros" required>
            <br>
            <button type="submit">Calcular</button>
        </form>
    </div>
    {% if total %}
        <div class="container">
            <p>Nombre del cliente: {{nombre}}</p>
            <p>Total sin descuento: ${{total}}</p>
            <p>El descuento es: ${{descontado}}</p>
            <p>El total a pagar es de: ${{total_con_desc}}</p>
        </div>
    {% endif %}
</body>
</html>
