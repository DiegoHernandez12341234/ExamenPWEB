<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <title>Ejercicio 2 - Examen</title>
</head>
<body>
    <div class="container">
        <h1>Inicio de Sesión</h1>
        <form action="/ejercicio2" method="POST">
            <label for="nombre">Ingresa tu nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br>
            <label for="contra">Ingresa tu contraseña:</label>
            <input type="text" id="contra" name="contra" required>
            <br>
            <button type="submit">Calcular</button>
        </form>
    </div>
    {% if resultado %}
        <div class="container">
            <p>{{resultado}}</p>
        </div>
    {% endif %}
</body>
</html>
